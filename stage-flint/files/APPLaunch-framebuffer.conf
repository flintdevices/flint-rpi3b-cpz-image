# APPLaunch (LVGL's lv_linux_fbdev backend) defaults to /dev/fb0 unless
# overridden. On the real CardputerZero that's always the ST7789 panel — there's
# no competing GPU output. On this RPi 3B+ image, vc4-kms-v3d (kept enabled for
# HDMI debug output, see CLAUDE.md) also registers a framebuffer, and which one
# ends up as fb0 vs fb1 depends on kernel probe order/timing at boot: observed
# both "vc4 grabs fb0, ST7789 becomes fb1 (APPLaunch renders to the invisible
# HDMI fb, SPI panel stays black)" and "only fb1 exists, ST7789 works" across
# reboots of the same image — a boot-order race, not a config difference.
#
# stage2/05-cardputerzero already ships a udev rule (99-cardputer-zero-lcd.rules)
# creating a stable /dev/fb_lcd symlink to whichever fb node is the ST7789
# (matched by driver name, not by number), specifically to route around this.
# Point APPLaunch at it explicitly so it's correct regardless of probe order.
[Service]
Environment=APPLAUNCH_LINUX_FBDEV_DEVICE=/dev/fb_lcd
