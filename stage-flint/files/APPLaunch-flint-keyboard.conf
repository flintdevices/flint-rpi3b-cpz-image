# flint's evdev keyboard reader (flint/input/evdev_input.py, _auto_detect_device)
# looks for an input device whose name contains "tca8418" and, finding none on
# this board, falls back to a hardcoded /dev/input/event3 — which on the RPi 3B+
# is vc4-hdmi, not the keyboard, so no keypress reaches flint (only APPLaunch and
# console apps work). flint honours FLINT_KEYBOARD_DEVICE as an explicit override.
#
# APPLaunch launches flint (and every other app) as a child process, so setting
# this in APPLaunch's unit environment propagates to flint. Point it at the stable
# udev DEVLINK created by 99-flint-usb-keyboard.rules for the attached USB keyboard.
[Service]
Environment=FLINT_KEYBOARD_DEVICE=/dev/input/cardputerzero-kbd
